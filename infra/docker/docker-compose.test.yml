name: qinyang

services:
  mysql:
    image: ${MYSQL_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/mysql:8.4}
    container_name: qinyang-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max-connections=150
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-qinyang-root}
      MYSQL_DATABASE: ${DB_DATABASE:-qinyang_mall}
      MYSQL_USER: ${DB_USERNAME:-qinyang}
      MYSQL_PASSWORD: ${DB_PASSWORD:-qinyang}
    ports:
      # 仅绑定 127.0.0.1，不暴露校园网
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-qinyang-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - qinyang_mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    image: qinyang/api:${IMAGE_TAG:-local}
    container_name: qinyang-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      API_PREFIX: api/v1
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-qinyang}
      DB_PASSWORD: ${DB_PASSWORD:-qinyang}
      DB_DATABASE: ${DB_DATABASE:-qinyang_mall}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-dev-only-admin-secret-change-me}
      JWT_CUSTOMER_SECRET: ${JWT_CUSTOMER_SECRET:-dev-only-customer-secret-change-me}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_ROOT: /app/storage
      # 只读媒体根：catalog 已生成的商品图片，容器内只读挂载，不复制
      STORAGE_MEDIA_ROOT: ${STORAGE_MEDIA_ROOT:-/app/media}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://127.0.0.1:18110/static}
      WECHAT_MOCK_AUTH: ${WECHAT_MOCK_AUTH:-true}
      PAYMENT_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:18111}
    ports:
      - "127.0.0.1:18110:3000"
    healthcheck:
      # 镜像内无 curl/wget，用 node 内置 fetch 做存活探测
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    volumes:
      - ${MEDIA_ROOT:-../../media}:/app/media:ro
      - qinyang_storage:/app/storage
    deploy:
      resources:
        limits:
          # 三个服务合计 2.5 核 / 3.75GB，满足「日常测试服务 ≤ 2.5 核 / 4GB」约束
          cpus: "1.0"
          memory: 1500M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin-web
    image: qinyang/admin-web:${IMAGE_TAG:-local}
    container_name: qinyang-admin-web
    restart: unless-stopped
    depends_on:
      # nginx 在启动时解析上游域名，必须等 API 真正可用（健康）后再拉起，
      # 否则会因 "host not found in upstream api" 直接退出并进入重启循环。
      api:
        condition: service_healthy
        required: true
    ports:
      - "127.0.0.1:18111:80"
    volumes:
      # 后台 nginx 的 /static 直接托管媒体目录（只读）
      - ${MEDIA_ROOT:-../../media}:/var/www/media:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qinyang_mysql_data:
  qinyang_storage:
